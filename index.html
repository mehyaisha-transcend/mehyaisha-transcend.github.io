<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mehyaisha's Test Site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: 'Quicksand', system-ui, sans-serif; color: #7a2a4f;
      background: linear-gradient(135deg, #ffe0ee, #ffc2dd 50%, #ffd6e8);
    }
    main {
      max-width: 520px; margin: 1.5rem; padding: 2.5rem 2rem; text-align: center;
      background: rgba(255,255,255,.75); border: 3px solid #ff9ec7; border-radius: 28px;
      box-shadow: 0 12px 40px rgba(255,105,170,.3);
    }
    h1 { font-family: 'Pacifico', cursive; font-weight: 400; font-size: 2.4rem; margin: 0 0 .5rem; color: #e0458b; }
    p { line-height: 1.6; font-size: 1.1rem; }
    .sparkle { font-size: 1.6rem; letter-spacing: .4rem; }
    a.button {
      display: inline-block; margin-top: 1rem; padding: .8rem 1.8rem; border-radius: 999px;
      background: linear-gradient(90deg, #ff7eb6, #ff5fa2); color: #fff; font-weight: 600;
      text-decoration: none; box-shadow: 0 6px 16px rgba(255,95,162,.4); transition: transform .2s;
    }
    a.button:hover { transform: scale(1.06); }
  </style>
</head>
<body>
  <main>
    <div class="sparkle">✨ 💖 ✨</div>
    <h1>Mehyaisha's Test Site</h1>
    <p>Hi, Queen! If you can see this at your domain, hosting and DNS are working perfectly.</p>
    <a class="button" href="#">Test button</a>
  </main>
</body>
</html>
